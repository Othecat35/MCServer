[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcserver-cli"
dynamic = ["version"]
dependencies = []
requires-python = ">=3.12"
authors = [
  {name = "Othecat35", email = "othecat35@gmail.com"}
]
description = "A CLI tool to manage Minecraft: Java Edition servers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/Othecat35/MCServer"
Repository = "https://github.com/Othecat35/MCServer.git"
Changelog = "https://github.com/Othecat35/MCServer/blob/main/CHANGELOG.md"

[project.scripts]
mcserver = "mcserver.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcserver"]

[tool.hatch.version]
path = "src/mcserver/__init__.py"
